name: Scraping Ligue 1 Benin

on:
  schedule:
    # Toutes les 6 heures (00h, 06h, 12h, 18h UTC).
    # Chaque commit du scraper declenche un deploiement Vercel qui invalide
    # tout le cache : espacer les passages reduit fortement les ecritures ISR.
    # Un classement de Ligue 1 ne change pas toutes les heures.
    - cron: "0 */6 * * *"
  workflow_dispatch: {} # permet aussi un lancement manuel depuis l'onglet Actions

permissions:
  contents: read # plus de commit : la synchro se fait dans Supabase

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet, requis pour git pull --rebase

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installation des dependances
        run: npm ci

      - name: Lancement du scraper
        run: npm run scrape
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # IMPORTANT : on ne commite plus les fichiers JSON.
      # Le scraper synchronise deja les donnees dans Supabase, et le site lit
      # Supabase en priorite (les JSON du depot ne servent que de secours).
      # Chaque commit declenchait un deploiement Vercel qui vidait tout le
      # cache ISR et forcait la regeneration de toutes les pages : c'etait la
      # principale source de consommation du quota.
      - name: Resultat
        run: echo "Donnees synchronisees dans Supabase. Aucun commit necessaire."
