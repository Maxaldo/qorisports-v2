name: Scraping Ligue 1 Benin

on:
  schedule:
    # Toutes les 6 heures (00h, 06h, 12h, 18h UTC).
    # Chaque commit du scraper declenche un deploiement Vercel qui invalide
    # tout le cache : espacer les passages reduit fortement les ecritures ISR.
    # Un classement de Ligue 1 ne change pas toutes les heures.
    - cron: "0 */6 * * *"
  workflow_dispatch: {} # permet aussi un lancement manuel depuis l'onglet Actions

permissions:
  contents: write # autorise le commit des donnees mises a jour

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet, requis pour git pull --rebase

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installation des dependances
        run: npm ci

      - name: Lancement du scraper
        run: npm run scrape
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit des donnees si elles ont change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/*.json
          if git diff --staged --quiet; then
            echo "Aucune donnee modifiee, rien a committer."
          else
            git commit -m "chore: mise a jour automatique des donnees Ligue 1"
            # Recupere d'abord les eventuels changements distants (ex: push
            # manuel de Max) puis pousse ; reessaie jusqu'a 5 fois en cas de
            # course avec un autre push.
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && break
              echo "Push refuse (tentative $i), nouvel essai..."
              sleep 5
            done
          fi
